<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏贯验 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏贯验</h1>
      <div class="骨">已汇总缓冲与汇总账报文数互证。</div>
    </header>

    <section class="卷">
      <h2>空栏封印裁决（只读）</h2>
      <div id="空封裁决条">空封裁决加载中…</div>
      <div class="表绕 上距8"><table><thead><tr>
        <th>栏号</th><th>同票票号</th><th>空封指纹</th><th>水位同票</th><th>可回读</th><th>裁决</th>
      </tr></thead><tbody id="空封表"></tbody></table></div>
    </section>

    <section class="卷">
      <div class="工具"><button class="按钮" id="跑">跑栏贯验</button> <span id="果"></span></div>
      <div class="表绕"><table><thead><tr><th>时刻</th><th>在栏</th><th>汇总报文</th><th>坏点</th><th>结果</th><th>结栏同票</th><th>空封核对</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    async function 刷空封裁决() {
      const 裁 = await 探栏.挂载空封裁决("空封裁决条");
      const tb = document.getElementById("空封表");
      if (!tb) return;
      tb.innerHTML = "";
      const rows = (裁 && 裁["明细"]) || [];
      if (!rows.length) {
        tb.innerHTML = `<tr><td colspan="6">${探栏.空态("尚无空封。空结后贯验改读空封集并与水位票同票核对。")}</td></tr>`;
        return;
      }
      for (const x of rows) {
        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(x.栏号)}</td>` +
          `<td>${探栏.安全文本(x["票号"] || x["批次编号"] || "")}</td>` +
          `<td class="铜字">${探栏.安全文本(x["空封指纹"] ? 探栏.短指纹(x["空封指纹"]) : "—")}</td>` +
          `<td>${x["水位同票"] ? 探栏.徽章("同票","ok") : 探栏.徽章("异票/断票","warn")}</td>` +
          `<td>${x["可回读"] ? "是" : "否"}</td>` +
          `<td>${探栏.空封状态徽章(x["裁决"])}</td>`
        ));
      }
    }
    async function 刷() {
      const rows = await 探栏.getJSON("/api/栏贯验");
      const tb = document.getElementById("表"); tb.innerHTML = "";
      for (const r of rows) {
        const ok = r.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
        let 核文 = "—";
        try { const j = JSON.parse(r.空封核对 || "{}"); 核文 = `空封${j["空封数"] ?? 0}·异常${j["异常数"] ?? 0}`; } catch (e) {}
        const 票 = (r.结栏票号 || "").split(",").filter(Boolean).length;
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.时刻)}</td><td>${r.在栏笔数}</td><td>${r.汇总报文数}</td><td>${r.坏点笔数}</td><td>${ok}</td><td>${票} 票</td><td>${探栏.安全文本(核文)}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
    }
    document.getElementById("跑").onclick = async () => {
      const d = await 探栏.postJSON("/api/栏贯验/跑");
      document.getElementById("果").innerHTML = d.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
      await 刷();
      await 刷空封裁决();
    };
    刷();
    刷空封裁决();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" class="亮">栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
